<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentGuard AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .state-healthy { color: #10b981; }
      .state-warning { color: #f59e0b; }
      .state-critical { color: #ef4444; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18.2.0'
      import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client'

      const API_BASE = 'https://agentguard-api.marketmesh-api.workers.dev'

      async function fetchApi(path, opts = {}) {
        const res = await fetch(`${API_BASE}${path}`, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } })
        if (!res.ok) throw new Error(`API ${path}: ${res.status}`)
        return res.json()
      }

      function StateBadge({ state }) {
        const color = state === 'healthy' ? 'bg-green-100 text-green-700' : state === 'warning' ? 'bg-amber-100 text-amber-700' : 'bg-red-100 text-red-700'
        return <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${color}`}>{state}</span>
      }

      function ServiceRow({ svc, onHeartbeat, onStop, onFailure }) {
        return (
          <tr className="border-b last:border-0">
            <td className="px-4 py-3 font-medium">{svc.name}</td>
            <td className="px-4 py-3 text-sm text-gray-500">{svc.expected_interval_s}s</td>
            <td className="px-4 py-3"><StateBadge state={svc.state} /></td>
            <td className="px-4 py-3 text-sm text-gray-500">{svc.last_seen_utc ? new Date(svc.last_seen_utc).toLocaleTimeString() : '—'}</td>
            <td className="px-4 py-3">
              <div className="flex gap-2">
                <button onClick={() => onHeartbeat(svc.id)} className="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Heartbeat</button>
                <button onClick={() => onStop(svc.id)} className="px-3 py-1.5 text-sm bg-amber-600 text-white rounded hover:bg-amber-700">Stop</button>
                <button onClick={() => onFailure(svc.id)} className="px-3 py-1.5 text-sm bg-red-600 text-white rounded hover:bg-red-700">Fail</button>
              </div>
            </td>
          </tr>
        )
      }

      function IncidentCard({ inc, onAck, onResolve }) {
        return (
          <div className="p-4 rounded-lg border border-gray-200 bg-white">
            <div className="flex justify-between items-start mb-2">
              <div>
                <div className="font-medium">{inc.rule}</div>
                <div className="text-xs text-gray-500">{inc.severity}</div>
              </div>
              <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${inc.status === 'open' ? 'bg-red-100 text-red-700' : inc.status === 'acknowledged' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700`} `}>
                {inc.status}
              </span>
            </div>
            <div className="text-xs text-gray-600 mb-3">Service: {inc.service_id} • {new Date(inc.first_seen_utc).toLocaleString()}</div>
            <div className="flex gap-2">
              {inc.status === 'open' && (
                <>
                  <button onClick={() => onAck(inc.id)} className="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Acknowledge</button>
                  <button onClick={() => onResolve(inc.id)} className="px-3 py-1.5 text-sm bg-green-600 text-white rounded hover:bg-green-700">Resolve</button>
                </>
              )}
            </div>
          </div>
        )
      }

      function App() {
        const [services, setServices] = React.useState([])
        const [incidents, setIncidents] = React.useState([])
        const [actions, setActions] = React.useState([])
        const [loading, setLoading] = React.useState(false)

        React.useEffect(() => {
          load()
          const id = setInterval(load, 5000)
          return () => clearInterval(id)
        }, [])

        async function load() {
          try {
            const [svcs, incs, acts] = await Promise.all([
              fetchApi('/api/services'),
              fetchApi('/api/incidents'),
              fetchApi('/api/actions')
            ])
            setServices(svcs)
            setIncidents(incs)
            setActions(acts)
          } catch (e) { console.error(e) }
        }

        const onHeartbeat = async (id) => {
          setLoading(true)
          try {
            await fetchApi(`/api/demo/heartbeat`, { method: 'POST', body: JSON.stringify({ service_id: id }) })
            load()
          } finally { setLoading(false) }
        }

        const onStop = async (id) => {
          setLoading(true)
          try {
            await fetchApi(`/api/demo/stop`, { method: 'POST', body: JSON.stringify({ service_id: id }) })
            load()
          } finally { setLoading(false) }
        }

        const onFailure = async (id) => {
          setLoading(true)
          try {
            await fetchApi(`/api/demo/failure`, { method: 'POST', body: JSON.stringify({ service_id: id }) })
            load()
          } finally { setLoading(false) }
        }

        const onAck = async (id) => {
          await fetchApi(`/api/incidents/${id}/ack`, { method: 'POST', body: JSON.stringify({ actor: 'recruiter-demo' }) })
          load()
        }

        const onResolve = async (id) => {
          await fetchApi(`/api/incidents/${id}/resolve`, { method: 'POST', body: JSON.stringify({ actor: 'recruiter-demo', note: 'Demo resolution' }) })
          load()
        }

        return (
          <div className="min-h-screen">
            <nav className="bg-white border-b shadow-sm">
              <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center text-white font-bold">A</div>
                  <span className="font-bold text-xl text-gray-800">AgentGuard AI</span>
                </div>
                <div className="flex items-center gap-4 text-sm text-gray-600">
                  <span>Demo mode • No real infrastructure</span>
                </div>
              </div>
            </nav>

            <div className="max-w-7xl mx-auto px-4 py-6">
              <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
                <div className="lg:col-span-3">
                  <div className="bg-white rounded-lg shadow-sm border p-6">
                    <h2 className="font-bold text-lg mb-4">Services</h2>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="border-b">
                            <th className="px-4 py-2 text-left font-semibold text-gray-600">Name</th>
                            <th className="px-4 py-2 text-left font-semibold text-gray-600">Interval</th>
                            <th className="px-4 py-2 text-left font-semibold text-gray-600">State</th>
                            <th className="px-4 py-2 text-left font-semibold text-gray-600">Last Seen</th>
                            <th className="px-4 py-2 text-left font-semibold text-gray-600">Controls</th>
                          </tr>
                        </thead>
                        <tbody>
                          {services.map(svc => (
                            <ServiceRow key={svc.id} svc={svc} onHeartbeat={onHeartbeat} onStop={onStop} onFailure={onFailure} />
                          ))}
                          {services.length === 0 && (
                            <tr><td colSpan={5} className="px-4 py-4 text-center text-gray-500">No services</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
                <div className="lg:col-span-1">
                  <div className="bg-white rounded-lg shadow-sm border p-4">
                    <h3 className="font-bold mb-3">Quick Actions</h3>
                    <div className="space-y-2">
                      <button onClick={load} className="w-full py-2 text-sm border rounded hover:bg-gray-50">Refresh</button>
                    </div>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2">
                  <div className="bg-white rounded-lg shadow-sm border p-4">
                    <h2 className="font-bold mb-4">Incidents</h2>
                    <div className="space-y-3">
                      {incidents.length > 0 ? incidents.map(inc => (
                        <IncidentCard key={inc.id} inc={inc} onAck={onAck} onResolve={onResolve} />
                      )) : (
                        <div className="text-center py-8 text-gray-400 text-sm">No incidents. Use the demo controls to trigger one.</div>
                      )}
                    </div>
                  </div>
                </div>
                <div className="lg:col-span-1">
                  <div className="bg-white rounded-lg shadow-sm border p-4">
                    <h2 className="font-bold mb-4">Audit Trail</h2>
                    <div className="space-y-3 max-h-64 overflow-y-auto">
                      {actions.length > 0 ? actions.map(a => (
                        <div key={a.id} className="p-3 rounded border bg-gray-50 text-xs">
                          <div className="font-medium">{a.action}</div>
                          <div className="text-gray-600">{a.actor}</div>
                          <div className="text-gray-400">{new Date(a.approved_utc).toLocaleTimeString()}</div>
                          {a.audit_note && <div className="text-gray-500 mt-1">{a.audit_note}</div>}
                        </div>
                      )) : (
                        <div className="text-center py-4 text-gray-400 text-sm">No actions yet</div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
