version: '3.8'

services:
  api:
    build: ./apps/api
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - NODE_ENV=production
    volumes:
      - ./apps/api:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE=http://localhost:4001
    volumes:
      - ./apps/web:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
